name: Windows build and regression tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build portable application
        shell: powershell
        run: ./scripts/Build.ps1
      - name: Run fixtures and isolated non-switching checks
        shell: powershell
        run: ./scripts/Test.ps1
      - name: Retain portable package and checksums
        uses: actions/upload-artifact@v4
        with:
          name: SoundToggle-windows
          path: |
            dist/SoundToggle.exe
            dist/SoundToggle-Portable.zip
            dist/SHA256SUMS.txt
